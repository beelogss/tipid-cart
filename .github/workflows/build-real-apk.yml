
name: Build Real Tipid Cart APK

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o tipid_cart_android_project.zip -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        working-directory: source/tipid_cart_android_project
        run: flutter create --platforms=android .

      - name: Get dependencies
        working-directory: source/tipid_cart_android_project
        run: flutter pub get

      - name: Build APK
        working-directory: source/tipid_cart_android_project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tipid-cart-apk
          path: source/tipid_cart_android_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
