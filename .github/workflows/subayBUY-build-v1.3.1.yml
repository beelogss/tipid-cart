name: Build subayBUY APK v1.3.1

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'subayBUY_branded_source_v1.3.1.zip'
      - '.github/workflows/subayBUY-build-v1.3.1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract subayBUY v1.3.1 source
        run: unzip -o subayBUY_branded_source_v1.3.1.zip -d source

      - name: Verify source structure and remove obsolete duplicate guard
        working-directory: source/tipid_cart_android_project
        run: |
          test -s pubspec.yaml
          test -s lib/main.dart
          test -s lib/models.dart
          test -s lib/store.dart
          test -s lib/extra_screens.dart
          test -s assets/subaybuy_logo.png
          test -s assets/subaybuy_app_icon.png
          test ! -e lib/wishlist_screen.dart
          grep -q "import 'extra_screens.dart';" lib/main.dart
          grep -q "tipid_cart_v1" lib/store.dart

      - name: Generate Android project and retain existing organization ID
        working-directory: source/tipid_cart_android_project
        run: flutter create --platforms=android --org com.subaybuyan .

      - name: Remove Flutter starter test and use self-contained analyzer config
        working-directory: source/tipid_cart_android_project
        run: |
          rm -f test/widget_test.dart
          cat > analysis_options.yaml <<'EOF'
          analyzer:
            exclude:
              - build/**
          EOF

      - name: Set Android app display name
        working-directory: source/tipid_cart_android_project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          content, count = re.subn(r'android:label="[^"]*"', 'android:label="subayBUY"', content, count=1)
          if count != 1:
              raise SystemExit('Could not set android:label in AndroidManifest.xml')
          manifest.write_text(content)
          PY

      - name: Get Flutter dependencies
        working-directory: source/tipid_cart_android_project
        run: flutter pub get

      - name: Verify app branding assets
        working-directory: source/tipid_cart_android_project
        run: |
          test -s assets/subaybuy_logo.png
          test -s assets/subaybuy_app_icon.png
          grep -q "image_path: \"assets/subaybuy_app_icon.png\"" pubspec.yaml

      - name: Generate Android launcher icons
        working-directory: source/tipid_cart_android_project
        run: |
          dart run flutter_launcher_icons
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done

      - name: Run unit tests
        working-directory: source/tipid_cart_android_project
        run: flutter test

      - name: Analyze Flutter source without warnings
        working-directory: source/tipid_cart_android_project
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Build arm64 debug APK
        working-directory: source/tipid_cart_android_project
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify APK output
        working-directory: source/tipid_cart_android_project
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          cp "$APK" build/app/outputs/flutter-apk/subayBUY.apk
          test -s build/app/outputs/flutter-apk/subayBUY.apk
          unzip -t build/app/outputs/flutter-apk/subayBUY.apk >/dev/null
          ls -lh build/app/outputs/flutter-apk/subayBUY.apk

      - name: Upload subayBUY APK
        uses: actions/upload-artifact@v4
        with:
          name: subayBUY-apk-v1.3.1
          path: source/tipid_cart_android_project/build/app/outputs/flutter-apk/subayBUY.apk
          if-no-files-found: error
          retention-days: 7
