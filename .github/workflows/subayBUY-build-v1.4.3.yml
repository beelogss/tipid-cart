name: Build subayBUY APK v1.4.3

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'subayBUY_branded_source_v1.4.3.zip'
      - '.github/workflows/subayBUY-build-v1.4.3.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract subayBUY v1.4.3 source
        run: unzip -o subayBUY_branded_source_v1.4.3.zip -d source

      - name: Verify source structure, version, and fixes
        working-directory: source/tipid_cart_android_project
        run: |
          set -e
          test -s pubspec.yaml
          test -s lib/main.dart
          test -s lib/store.dart
          test -s lib/extra_screens.dart
          test -s lib/built_in_camera_screen.dart
          test -s lib/camera_preview_geometry.dart
          test -s lib/trip_screen.dart
          test -s assets/subaybuy_logo.png
          test -s assets/subaybuy_app_icon.png
          grep -q '^version: 1.4.3+10$' pubspec.yaml
          test -s lib/notifications.dart
          test -s test/notifications_test.dart
          test -s test/unit_price_test.dart
          test -s test/store_test.dart
          grep -q 'showTransientNotice' lib/trip_screen.dart
          grep -q 'GlobalKey<ScaffoldMessengerState> _messengerKey' lib/trip_screen.dart
          ! grep -q 'SnackBarAction' lib/trip_screen.dart
          ! grep -q 'SnackBarAction' lib/notifications.dart
          grep -q 'duration: duration' lib/notifications.dart
          grep -q 'persist: false' lib/notifications.dart
          grep -q 'duplicateTrip' lib/store.dart
          grep -q "Tab(text: 'Unit price')" lib/extra_screens.dart
          grep -q "import 'built_in_camera_screen.dart';" lib/trip_screen.dart
          grep -q 'cameraPreviewCoverScale' lib/built_in_camera_screen.dart
          grep -q 'clearSnackBars' lib/trip_screen.dart
          grep -q 'Duration(seconds: 2)' lib/notifications.dart
          grep -q 'tipid_cart_v1' lib/store.dart
          grep -q 'subaybuy_wishlist_v1' lib/store.dart
          grep -q 'subaybuy_price_history_v1' lib/store.dart
          test -s test/models_test.dart
          test -s test/wishlist_widget_test.dart
          test -s test/camera_preview_geometry_test.dart
          test -s test/notifications_test.dart
          test -s test/unit_price_test.dart
          test -s test/store_test.dart

      - name: Generate Android project
        working-directory: source/tipid_cart_android_project
        run: flutter create --platforms=android --org com.subaybuyan .

      - name: Remove Flutter-generated starter widget test
        working-directory: source/tipid_cart_android_project
        run: |
          rm -f test/widget_test.dart
          test ! -e test/widget_test.dart
          test -s test/models_test.dart
          test -s test/wishlist_widget_test.dart
          test -s test/camera_preview_geometry_test.dart
          test -s test/notifications_test.dart
          test -s test/unit_price_test.dart
          test -s test/store_test.dart

      - name: Lock application ID and minimum Android version
        working-directory: source/tipid_cart_android_project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          expected = 'com.subaybuyan.tipid_cart'
          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')
          if kts.exists():
              p = kts
              s = p.read_text()
              s, n1 = re.subn(r'namespace\s*=\s*"[^"]+"', f'namespace = "{expected}"', s, count=1)
              s, n2 = re.subn(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{expected}"', s, count=1)
              s, n3 = re.subn(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', s, count=1)
          elif groovy.exists():
              p = groovy
              s = p.read_text()
              s, n1 = re.subn(r'namespace\s+["\'][^"\']+["\']', f'namespace "{expected}"', s, count=1)
              s, n2 = re.subn(r'applicationId\s+["\'][^"\']+["\']', f'applicationId "{expected}"', s, count=1)
              s, n3 = re.subn(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 24', s, count=1)
          else:
              raise SystemExit('Could not find generated app Gradle file.')
          if n1 != 1 or n2 != 1 or n3 != 1:
              raise SystemExit(f'Could not lock Android identity/minSdk: namespace={n1}, applicationId={n2}, minSdk={n3}')
          p.write_text(s)
          print(f'Android application ID: {expected}')
          print('Android minSdk: 24')
          PY

      - name: Set Android app display name
        working-directory: source/tipid_cart_android_project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s, n = re.subn(r'android:label="[^"]*"', 'android:label="subayBUY"', s, count=1)
          if n != 1:
              raise SystemExit('Could not set app label in AndroidManifest.xml')
          p.write_text(s)
          PY

      - name: Restore persistent Android signing key
        env:
          SUBAYBUY_DEBUG_KEYSTORE_BASE64: ${{ secrets.SUBAYBUY_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$SUBAYBUY_DEBUG_KEYSTORE_BASE64" ]; then
            echo '::error::Missing GitHub Actions secret SUBAYBUY_DEBUG_KEYSTORE_BASE64.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$SUBAYBUY_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Get Flutter dependencies
        working-directory: source/tipid_cart_android_project
        run: flutter pub get

      - name: Verify launcher assets and generate icons
        working-directory: source/tipid_cart_android_project
        run: |
          set -e
          test -s assets/subaybuy_logo.png
          test -s assets/subaybuy_app_icon.png
          dart run flutter_launcher_icons
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done

      - name: Verify intended test suite
        working-directory: source/tipid_cart_android_project
        run: |
          test ! -e test/widget_test.dart
          test -s test/models_test.dart
          test -s test/wishlist_widget_test.dart
          test -s test/camera_preview_geometry_test.dart
          test -s test/notifications_test.dart
          test -s test/unit_price_test.dart
          test -s test/store_test.dart

      - name: Run unit and widget tests
        working-directory: source/tipid_cart_android_project
        run: flutter test

      - name: Analyze Flutter source
        working-directory: source/tipid_cart_android_project
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Build arm64 APK with persistent signing key
        working-directory: source/tipid_cart_android_project
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify APK package, version, and signature
        working-directory: source/tipid_cart_android_project
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools"
          AAPT=$(find "$BUILD_TOOLS" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER=$(find "$BUILD_TOOLS" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)
          test -n "$AAPT"
          test -n "$APKSIGNER"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -q "package: name='com.subaybuyan.tipid_cart' versionCode='10' versionName='1.4.3'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" build/app/outputs/flutter-apk/subayBUY.apk
          unzip -t build/app/outputs/flutter-apk/subayBUY.apk >/dev/null
          ls -lh build/app/outputs/flutter-apk/subayBUY.apk

      - name: Upload subayBUY APK
        uses: actions/upload-artifact@v4
        with:
          name: subayBUY-apk-v1.4.3
          path: source/tipid_cart_android_project/build/app/outputs/flutter-apk/subayBUY.apk
          if-no-files-found: error
          retention-days: 14
